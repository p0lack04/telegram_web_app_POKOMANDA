name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  private-files-services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run generate
      - run: docker compose -f compose.files-test.yml up -d
      - run: node scripts/wait-files-test.mjs
      - run: npm test -w backend -- --run test/bank-files.integration.test.ts
        env:
          RUN_FILES_SERVICES: '1'
      - if: failure()
        run: docker compose -f compose.files-test.yml logs --tail=100
      - if: always()
        run: docker compose -f compose.files-test.yml down
