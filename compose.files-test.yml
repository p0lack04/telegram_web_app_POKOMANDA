# Isolated synthetic test services. Never use these credentials in production.
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: synthetic-test
      MINIO_ROOT_PASSWORD: synthetic-test-only-password
    ports: ["127.0.0.1:19000:9000"]
    tmpfs: ["/data"]
  bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    entrypoint: /bin/sh
    command: ["-c", "until mc alias set test http://minio:9000 synthetic-test synthetic-test-only-password; do sleep 1; done; mc mb --ignore-existing test/komanda-test; mc anonymous set none test/komanda-test"]
  clamav:
    image: clamav/clamav:1.4
    ports: ["127.0.0.1:13310:3310"]
    environment:
      CLAMD_CONF_StreamMaxLength: 50M
      CLAMD_CONF_MaxFileSize: 50M
      CLAMD_CONF_MaxScanSize: 100M
      CLAMD_CONF_AlertExceedsMax: "yes"
