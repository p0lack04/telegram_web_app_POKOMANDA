# Isolated synthetic test services. Never use these credentials in production.
services:
  minio:
    build:
      context: ./scripts
      dockerfile: minio-test.Dockerfile
    command: server /data
    environment:
      MINIO_ROOT_USER: synthetic-test
      MINIO_ROOT_PASSWORD: synthetic-test-only-password
    ports: ["127.0.0.1:19000:9000"]
    tmpfs: ["/data"]
  clamav:
    image: clamav/clamav:1.4
    ports: ["127.0.0.1:13310:3310"]
    environment:
      CLAMD_CONF_StreamMaxLength: 50M
      CLAMD_CONF_MaxFileSize: 50M
      CLAMD_CONF_MaxScanSize: 100M
      CLAMD_CONF_AlertExceedsMax: "yes"
